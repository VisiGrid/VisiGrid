# Minimum toolchain for the gpui dependency (Zed v1.22.0), which needs
# Rust 1.98.1. Keep this equal to the channel in Zed's own
# rust-toolchain.toml at the tag gpui-app/Cargo.toml pins. rustup-managed
# machines pick this up automatically; distro-packaged toolchains (no
# rustup) need rustc >= 1.98.1 on their own.
[toolchain]
channel = "1.98.1"
# CI runs clippy against this pinned toolchain, not the `stable` the
# workflow installs, so the component has to be declared here or the
# Clippy step fails with "'cargo-clippy' is not installed for 1.98.1".
components = ["clippy"]
