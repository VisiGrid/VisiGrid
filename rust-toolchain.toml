# Minimum toolchain for the gpui (Zed v1.12.0) dependency, which uses
# std::hint::cold_path — stabilized in Rust 1.95.0. Zed pins the same
# version in its own rust-toolchain.toml. rustup-managed machines pick
# this up automatically; distro-packaged toolchains (no rustup) need
# rustc >= 1.95 on their own.
[toolchain]
channel = "1.95.0"
# CI runs clippy against this pinned toolchain, not the `stable` the
# workflow installs, so the component has to be declared here or the
# Clippy step fails with "'cargo-clippy' is not installed for 1.95.0".
components = ["clippy"]
