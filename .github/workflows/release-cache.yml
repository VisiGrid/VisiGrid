name: Release cache

# Builds the release targets on main and saves their cargo caches, so tag
# builds (release.yml) start warm. A tag run can only restore caches saved on
# its own tag or on the default branch; it never sees an earlier tag's. Before
# this, every release compiled everything cold, DuckDB's C++ included
# (~19 of Linux's 31 build minutes), and macOS hit release.sh's 60-minute wait.
#
# Both workflows build through scripts/ci/release-build.sh and use the same
# key prefix. If either drifts, the cache restores and still rebuilds DuckDB.
# Check: a release's Linux log should not show "Compiling libduckdb-sys".

on:
  push:
    branches: [main]
    paths:
      - rust-toolchain.toml
      - Cargo.lock
      - scripts/ci/release-build.sh
      - .github/workflows/release-cache.yml
  schedule:
    - cron: '17 6 * * 1'   # weekly, Monday 06:17 UTC
  workflow_dispatch:

concurrency:
  group: release-cache
  cancel-in-progress: true

permissions:
  contents: read
  actions: write   # to delete superseded caches

env:
  CARGO_BUILD_JOBS: 2

jobs:
  # A release's version bump rewrites Cargo.lock, but only for VisiGrid's own
  # crates, which are rebuilt on every release anyway. Rebuild only when the
  # toolchain, an external dependency, or this machinery changed.
  gate:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" != "push" ] \
            || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
            || ! git diff --quiet "$BEFORE" HEAD -- scripts/ci/release-build.sh .github/workflows/release-cache.yml; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif python3 scripts/ci/deps-changed.py "$BEFORE" HEAD; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: ubuntu-24.04-arm
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-15
            platform: macos
    runs-on: ${{ matrix.os }}
    # A cold build is the same ~65-minute macOS build as a release.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      # Same system packages as release.yml's Linux jobs: some -sys crates
      # probe for them, and a different probe result is a different build.
      - name: Install dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Add targets to pinned toolchain
        if: matrix.platform == 'macos'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Restore cargo cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-release-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-release-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Build release
        shell: bash
        run: bash scripts/ci/release-build.sh ${{ matrix.platform }}

      # Caches are immutable, so each save gets a unique key. Tag builds pick
      # the newest under the prefix.
      - name: Save cargo cache
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-release-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}-${{ github.run_id }}

      # Keep one cache per platform (~1.3-3 GB each against the repo's 10 GB):
      # delete this platform's older release caches, including those from a
      # previous toolchain.
      - name: Delete superseded caches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREFIX: ${{ runner.os }}-${{ runner.arch }}-release-
          KEEP: ${{ runner.os }}-${{ runner.arch }}-release-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}-${{ github.run_id }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key "$PREFIX" --limit 100 --json id,key,ref \
            --jq ".[] | select(.ref == \"refs/heads/main\" and .key != \"$KEEP\") | .id" |
          while read -r id; do
            gh cache delete "$id" --repo "$GITHUB_REPOSITORY"
          done
