# Build and test every pull request.
#
# Until this existed, nothing verified an incoming PR: the release workflow
# runs on tags, so an outside contribution was reviewed on trust and whatever
# a maintainer happened to run locally. #10 was checked by hand, which does not
# scale past the first contributor — and a contributor could not see their own
# change was green without asking.
name: PR

on:
  pull_request:
    branches: [main]

# A new push to the same PR makes the previous run irrelevant.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Bundled DuckDB compilation is memory intensive.
  CARGO_BUILD_JOBS: 2

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # The PostgreSQL recipe source's read-only proof runs against a real
    # server (crates/io/tests/recipe_postgres.rs); it makes its own database
    # and roles. The password is a throwaway for this container only.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-not-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VISIGRID_TEST_POSTGRES: host=127.0.0.1 port=5432 user=postgres password=ci-only-not-secret dbname=postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same set the release build installs — the GUI crate needs them even to
      # compile, so a leaner list fails confusingly rather than quickly.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libfuse2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-pr-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-pr-

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: License compatibility with commercial and ordered JSON features
        run: cargo test --locked -p visigrid-license --features commercial,serde_json/preserve_order

      # The workspace build covers the lean browser engine (the default). The
      # web app's live editing ships the full one, and live-client-bundle.yml
      # is dispatch-only, so compile both browser builds on every PR.
      - name: Browser engine, lean and full builds
        # cargo uses the toolchain pinned in rust-toolchain.toml, not the
        # stable one installed above, so the target goes on the pinned one.
        run: |
          rustup target add --toolchain "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" wasm32-unknown-unknown
          cargo check --locked -p visigrid-engine-wasm --target wasm32-unknown-unknown
          cargo check --locked -p visigrid-engine-wasm --features recipes --target wasm32-unknown-unknown

      # A first contribution should not fail on a lint the project has hundreds
      # of already, and it will not: clippy exits 0 when it only has warnings.
      # So `|| true` never protected anyone from the backlog — its only effect
      # was hiding clippy's deny-by-default lints, which are the correctness
      # class, and it did. `approx_constant` and `erasing_op` were failing this
      # step while it reported success, because a cold run dies before
      # gpui-app and a warm one never rechecks it.
      #
      # Without the `|| true` this fails on deny-by-default lints and real
      # compile errors, and still never on the ~590 warnings. Verified: a cold
      # `cargo clippy --workspace --all-targets` in a clean target dir exits 0.
      - name: Clippy
        run: cargo clippy --workspace --all-targets

  # The job above builds and tests on Linux only, so a change that breaks the
  # macOS or Windows build was first compiled by the release workflow, after
  # the tag was pushed. The Zed v1.22 gpui bump (#77) shipped in 0.43.0 having
  # been compiled for macOS and Windows only by a hand-dispatched dry run.
  # A type-check is enough to catch that class (platform-gated code, cfg(unix)
  # tests, platform crates) without the time of a full release build.
  check-macos-windows:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-pr-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-pr-check-

      - name: Check the app and CLI, tests included
        run: cargo check --locked -p visigrid-gpui -p visigrid-cli --all-targets
