[package]
name = "scratch-window-spike"
version = "0.0.0"
edition = "2021"
publish = false
description = "Phase 0 spike for VisiGrid scratch mode: PopUp window + global hotkey on the pinned gpui fork"

[workspace]

[dependencies]
gpui = { git = "https://github.com/VisiGrid/zed", rev = "218fb58d83" }
gpui_platform = { git = "https://github.com/VisiGrid/zed", rev = "218fb58d83", features = ["wayland", "x11", "font-kit"] }
global-hotkey = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.dev]
opt-level = 1
