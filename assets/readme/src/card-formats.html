<!doctype html>
<html><head><meta charset="utf-8"><title>VisiGrid formats</title>
<link rel="stylesheet" href="base.css">
<style>
  body { height: 820px; }
  .chips { position: absolute; left: 950px; top: 160px; width: 960px; }
  .row-label { font-family: 'JetBrains Mono', monospace; font-size: 20px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 34px 0 18px; }
  .row-label:first-child { margin-top: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; }
  .chip { font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 500; padding: 12px 22px; border-radius: 14px;
          background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); }
  .chip.k { background: rgba(59,130,246,.16); border-color: rgba(96,165,250,.45); color: #dbeafe; }
</style></head>
<body><div class="card grain">
  <div class="glow"></div>
  <div class="copy">
    <div class="logo">
      <svg viewBox="0 0 512 512"><path d="M76,0 H228 V172 L172,228 H0 V76 A76,76 0 0 1 76,0 Z"/><path d="M284,0 H436 A76,76 0 0 1 512,76 V228 H340 L284,172 V0 Z"/><path d="M0,284 H172 L228,340 V512 H76 A76,76 0 0 1 0,436 V284 Z"/><path d="M340,284 H512 V436 A76,76 0 0 1 436,512 H284 V340 L340,284 Z"/></svg>
      <span>VisiGrid</span>
    </div>
    <div class="label">Formats</div>
    <h2>Opens the files you already have.</h2>
    <p>Excel, OpenDocument and plain text in; Excel back out. Your data stays in standard formats on your own disk.</p>
  </div>
  <div class="chips">
    <div class="row-label">Open</div>
    <div class="row"><span class="chip k">.xlsx</span><span class="chip">.xls</span><span class="chip">.xlsb</span><span class="chip">.ods</span><span class="chip k">.csv</span><span class="chip">.tsv</span><span class="chip">.json</span></div>
    <div class="row-label">Save and export</div>
    <div class="row"><span class="chip k">.xlsx</span><span class="chip">.csv</span><span class="chip">.tsv</span><span class="chip">.json</span><span class="chip k">.sheet</span></div>
    <div class="row-label">From the CLI</div>
    <div class="row"><span class="chip">Parquet</span><span class="chip">DuckDB</span><span class="chip">visigrid-json</span></div>
  </div>
</div></body></html>
