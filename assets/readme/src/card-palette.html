<!doctype html>
<html><head><meta charset="utf-8"><title>VisiGrid command palette</title>
<link rel="stylesheet" href="base.css">
<style>
  body { height: 820px; }
  /* Window bleeds off the right and bottom edges; offset so the palette sits in frame */
  .window { position: absolute; left: 930px; top: 120px; width: 1520px; }
</style></head>
<body><div class="card grain">
  <div class="glow"></div>
  <div class="window"><img src="shot-palette.png" alt=""></div>
  <div class="copy">
    <div class="logo">
      <svg viewBox="0 0 512 512"><path d="M76,0 H228 V172 L172,228 H0 V76 A76,76 0 0 1 76,0 Z"/><path d="M284,0 H436 A76,76 0 0 1 512,76 V228 H340 L284,172 V0 Z"/><path d="M0,284 H172 L228,340 V512 H76 A76,76 0 0 1 0,436 V284 Z"/><path d="M340,284 H512 V436 A76,76 0 0 1 436,512 H284 V340 L340,284 Z"/></svg>
      <span>VisiGrid</span>
    </div>
    <div class="label">Command palette</div>
    <h2>Every action is one keystroke away.</h2>
    <p><kbd>⌘⇧P</kbd> and type what you want. <code>:A1</code> jumps to a cell, <code>=</code> searches functions, <code>@</code> searches cells. There are no menus to dig through.</p>
  </div>
</div></body></html>
