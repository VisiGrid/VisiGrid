[package]
name = "visigrid-engine-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WASM build of the formula engine for client-side verification"

[lib]
crate-type = ["cdylib", "rlib"]

# rustc emits bulk-memory instructions (memory.copy and friends) by default.
# wasm-pack pins its own wasm-opt — version 117 here — which rejects them, and
# passing --enable-bulk-memory does not help because that build predates the
# support. The release build then dies in the optimizer *after* writing a valid
# .wasm, which is the dangerous shape: the file looks finished.
#
# So the optimizer is off rather than fatal. The unoptimized bundle is 599 KB,
# smaller than the 625 KB one it replaces, so nothing regresses by turning it
# off today. Re-enable with a modern binaryen (Arch ships 130) once the build
# can be pointed at one; expect roughly 10-20% off the wire.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
visigrid-engine = { path = "../engine" }
wasm-bindgen = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
# Recipe snapshot hashes, as the desktop computes them.
blake3 = "1"
# The collaboration replica (CollabClient). No simulator (no RNG backend in
# the browser), and visigrid-json only from io (no DuckDB, SQLite or XLSX).
# Optional: only the `collab` build carries them (see [features]).
visigrid-collab = { path = "../collab", default-features = false, optional = true }
visigrid-io = { path = "../io", default-features = false, features = ["recipes"], optional = true }
uuid = { version = "1", optional = true }

# Two browser builds from one commit. The default is the lean engine (formula
# evaluation, verification, inspection, formula help) that every page of the
# web app loads. `collab` adds the live-editing replica (CollabClient) and its
# document I/O; `recipes` adds CSV recipe previews on top of it. The web app
# loads the collab build only where live editing runs, so its size (~4x) is
# not paid by the classic editor.
[features]
default = []
collab = ["dep:visigrid-collab", "dep:visigrid-io", "dep:uuid"]
recipes = ["collab"]
