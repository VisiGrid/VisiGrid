[package]
name = "visigrid-session-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Session server host: TCP protocol server + request handlers over a Workbook (GUI and headless)"

[dependencies]
visigrid-engine = { workspace = true }
visigrid-protocol = { path = "../protocol" }
serde = { workspace = true }
serde_json = "1"
smol = "2"
log = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
libc = "0.2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
rand = "0.8"
base64 = "0.22"
subtle = "2"
