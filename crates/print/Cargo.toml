[package]
name = "visigrid-print"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Device-independent worksheet pagination for print and PDF"

[features]
default = []
pdf-spike = ["dep:krilla"]
pdf = ["dep:krilla", "dep:cosmic-text", "dep:visigrid-engine", "dep:tempfile"]
preview = ["pdf", "dep:hayro"]
native-print = ["pdf", "dep:ashpd", "dep:futures-lite"]

[dependencies]
krilla = { version = "0.8.2", default-features = false, features = ["simple-text"], optional = true }
cosmic-text = { version = "0.19", default-features = false, features = ["std", "fontconfig"], optional = true }
visigrid-engine = { workspace = true, optional = true }
tempfile = { version = "3", optional = true }
hayro = { version = "0.7.1", default-features = false, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "print"], optional = true }
futures-lite = { version = "2", optional = true }

[dev-dependencies]
smol = "2"
visigrid-io = { workspace = true }

[[example]]
name = "pdf_spike"
required-features = ["pdf-spike"]

[[example]]
name = "export_pdf"
required-features = ["pdf"]

[[example]]
name = "preview_pdf"
required-features = ["preview"]

[[example]]
name = "system_print"
required-features = ["native-print"]
