[package]
name = "visigrid-print"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Device-independent worksheet pagination for print and PDF"

[features]
default = []
pdf-spike = ["dep:krilla"]
pdf = ["dep:krilla", "dep:cosmic-text", "dep:visigrid-engine", "dep:tempfile"]

[dependencies]
krilla = { version = "0.8.2", default-features = false, features = ["simple-text"], optional = true }
cosmic-text = { version = "0.19", default-features = false, features = ["std", "fontconfig"], optional = true }
visigrid-engine = { workspace = true, optional = true }
tempfile = { version = "3", optional = true }

[dev-dependencies]
visigrid-io = { workspace = true }

[[example]]
name = "pdf_spike"
required-features = ["pdf-spike"]

[[example]]
name = "export_pdf"
required-features = ["pdf"]
