[package]
name = "visigrid-hub-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hub API client — shared between desktop and CLI"

[dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
dirs = "6"
sha2 = { workspace = true }

[dev-dependencies]
tempfile = "3"
httpmock = "0.8"
