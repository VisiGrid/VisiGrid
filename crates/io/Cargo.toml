[package]
name = "visigrid-io"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "File I/O - native format, CSV, Excel"

[features]
# Everything except the visigrid-json reader/writer: files on disk, XLSX, CSV,
# Parquet, DuckDB, SQLite. Default on, so every existing user is unchanged.
# The WASM engine builds with `default-features = false` to load visigrid-json
# documents in the browser exactly as the server does, without DuckDB.
default = ["native"]
native = [
    "dep:rusqlite", "dep:csv", "dep:calamine", "dep:rust_xlsxwriter", "dep:encoding_rs",
    "dep:quick-xml", "dep:zip", "dep:regex", "dep:blake3", "dep:uuid",
    "dep:chrono", "dep:dirs", "dep:toml", "dep:toml_edit", "dep:tempfile", "dep:parquet", "dep:libduckdb-sys",
]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true, optional = true }
visigrid-engine = { workspace = true }
csv = { version = "1", optional = true }
calamine = { version = "0.32", optional = true }
rust_xlsxwriter = { version = "0.79", optional = true }
encoding_rs = { version = "0.8", optional = true }
quick-xml = { version = "0.38", optional = true }
zip = { version = "4", optional = true }
regex = { version = "1", optional = true }
blake3 = { version = "1", optional = true }
sha2 = { workspace = true }
# Large-sheet bands (json::bands): raw deflate, pure Rust so the WASM engine reads them too.
miniz_oxide = "0.8"
uuid = { version = "1", features = ["v4"], optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
dirs = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
tempfile = { version = "3", optional = true }
toml_edit = { version = "0.25", optional = true }
# Parquet import/export. No Arrow: the record reader and typed writer
# are enough to fill/export a grid and
# keeps several large crates out of the build. The codecs are the ones real
# files are written with; a file using one left out fails to open with a clear
# error instead of partially loading.
parquet = { version = "59", default-features = false, features = ["snap", "zstd", "lz4", "flate2-zlib-rs", "brotli", "json"], optional = true }
libduckdb-sys = { version = "=1.10505.0", default-features = false, features = ["bundled", "parquet"], optional = true }
