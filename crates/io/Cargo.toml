[package]
name = "visigrid-io"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "File I/O - native format, CSV, Excel"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
visigrid-engine = { workspace = true }
csv = "1"
calamine = "0.32"
rust_xlsxwriter = "0.79"
encoding_rs = "0.8"
quick-xml = "0.38"
zip = "4"
regex = "1"
blake3 = "1"
sha2 = { workspace = true }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = { workspace = true }
toml = { workspace = true }
tempfile = "3"
# Parquet import/export. No Arrow: the record reader and typed writer
# are enough to fill/export a grid and
# keeps several large crates out of the build. The codecs are the ones real
# files are written with; a file using one left out fails to open with a clear
# error instead of partially loading.
parquet = { version = "59", default-features = false, features = ["snap", "zstd", "lz4", "flate2-zlib-rs", "brotli", "json"] }
libduckdb-sys = { version = "=1.10505.0", default-features = false, features = ["bundled", "parquet"] }
