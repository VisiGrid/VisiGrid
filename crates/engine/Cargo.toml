[package]
name = "visigrid-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Spreadsheet engine - cells, sheets, formulas"

[dependencies]
# Local timezone for TODAY/NOW. Already compiled for five other crates in this
# workspace, so this costs no build time. "clock" brings Local; on wasm the
# wasmbind feature reads the browser's zone.
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
ordered-float = { workspace = true }
rustc-hash = "2.0"
# Raw hash table for the column store's string pool (#18): the index holds
# 4-byte ids instead of a second copy of each string. Already in the tree.
hashbrown = { version = "0.16", default-features = false }
ssfmt = "0.1"
# REGEXTEST/REGEXEXTRACT/REGEXREPLACE. Already in the tree for io and cli.
# Default features would double the browser engine (+273 KB gzipped). Without
# "perf" (literal and DFA speedups for large haystacks, not cell-sized text) it
# is +128 KB; unicode-perl and unicode-case keep \w, \d and (?i) correct for
# accented and non-Latin text, which regex-lite (+25 KB) would get wrong.
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }

# Browser clock. std::time::SystemTime::now() panics on wasm32-unknown-unknown,
# which is why the volatile functions used to read as the Unix epoch there.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
