[package]
name = "visigrid-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Spreadsheet engine - cells, sheets, formulas"

[dependencies]
# Local timezone for TODAY/NOW. Already compiled for five other crates in this
# workspace, so this costs no build time. "clock" brings Local; on wasm the
# wasmbind feature reads the browser's zone.
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }
serde = { workspace = true }
serde_json = { workspace = true }
ordered-float = { workspace = true }
rustc-hash = "2.0"
ssfmt = "0.1"

# Browser clock. std::time::SystemTime::now() panics on wasm32-unknown-unknown,
# which is why the volatile functions used to read as the Unix epoch there.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
