[workspace]
resolver = "2"
default-members = ["gpui-app"]
members = [
    "crates/engine",
    "crates/session-host",
    "crates/engine-wasm",
    "crates/core",
    "crates/io",
    "crates/print",
    "crates/config",
    "crates/license",
    "crates/protocol",
    "crates/hub_client",
    "crates/recon",
    "crates/cli",
    "crates/scripting",
    "gpui-app",
]

[workspace.package]
version = "0.46.0"
edition = "2021"
license = "AGPL-3.0-only"

[workspace.dependencies]
# Shared dependencies
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
dirs = "5"
rusqlite = { version = "0.31", features = ["bundled"] }
toml = "0.8"
ordered-float = { version = "4", features = ["serde"] }
sha2 = "0.10"
hmac = "0.12"
chrono = { version = "0.4", features = ["serde"] }

# Internal crates
visigrid-engine = { path = "crates/engine" }
visigrid-core = { path = "crates/core" }
visigrid-io = { path = "crates/io" }
visigrid-config = { path = "crates/config" }
visigrid-license = { path = "crates/license" }
visigrid-protocol = { path = "crates/protocol" }
visigrid-hub-client = { path = "crates/hub_client" }
visigrid-recon = { path = "crates/recon" }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"

[profile.dev]
opt-level = 1

# DuckDB's bundled C++ engine is a 1.8 GB library when built with debug info,
# and every binary that uses visigrid-io (the CLI's dozens of test binaries
# included) links it statically, at 1-2 GB each: one test run filled a 476 GB
# disk. Nobody steps into DuckDB, so build its C++ without debug info. Our own
# crates keep theirs.
[profile.dev.package.libduckdb-sys]
debug = false
